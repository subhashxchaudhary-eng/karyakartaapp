<body>
  <div id="app"></div>
  <div id="rotate"><div><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffb627" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><h2 style="font-family:'Baloo 2',sans-serif">Phone seedha pakdiye</h2><p style="color:#b9b2e6">Neta portrait mode mein khela jaata hai.</p></div></div>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {}); } catch (e) {}
  </script>
